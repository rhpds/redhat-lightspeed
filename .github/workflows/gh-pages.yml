---
name: Deploy Antora to GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'site-pages.yml'
      - '.github/workflows/gh-pages.yml'
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'site-pages.yml'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the static lab guide
        run: npx --yes --package=@antora/cli@3.2.3 --package=@antora/site-generator@3.2.3 antora --log-failure-level=error site-pages.yml
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
