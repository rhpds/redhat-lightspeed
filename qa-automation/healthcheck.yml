---
# HEALTHCHECK — Environment readiness for event use (Red Hat Lightspeed lab LB1141)
#
# Verifies:
#   - Satellite host is reachable and services are operational
#   - RHEL target hosts are reachable from satellite (ping)
#   - SSH to rhel2 works (satellite-managed, key auth)
#   - HCC/Akamai connectivity verified via curl to Red Hat API endpoints
#   - Module 04/05 preconditions: rhel2 registered in Satellite, advisor
#     recommendation present, CVE baseline (vulnerable openssl), errata available
#   - Wetty terminals are accessible
#
# Non-destructive: does not modify any lab state.
# Should complete in under 90 seconds.
#
# NOTE: On freshly deployed environments, Lightspeed data checks (cvemap.xml,
# advisor recommendations, Insights API) may warn. Wait 15-20 minutes after
# provisioning for Lightspeed containers to fully initialize, then re-run.
# If the Insights API returns 404, the foreman_rh_cloud plugin may not be
# enabled — this requires Satellite admin intervention.
#
# Env vars injected by ZT runner:
#   BASTION_HOST, BASTION_PORT, BASTION_USER, BASTION_PASSWORD, GUID, DOMAIN
#
# Exit 0 = healthy, non-zero = unhealthy.

- name: Build inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add satellite host (bastion)
      ansible.builtin.add_host:
        name: satellite
        ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') | default('22', true) }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups: satellite

- name: Healthcheck - Satellite host
  hosts: satellite
  gather_facts: false
  become: true
  vars:
    satellite_password: "bc31c9a6-9ff0-11ec-9587-00155d1b0702"
  tasks:
    - name: Verify SSH connectivity
      ansible.builtin.ping:

    - name: Verify Satellite services are running
      ansible.builtin.command:
        cmd: hammer ping
      changed_when: false
      timeout: 30

    - name: Verify Satellite Web UI is responding
      ansible.builtin.uri:
        url: https://localhost/users/login
        validate_certs: false
        status_code: [200, 302]
      changed_when: false

    - name: Verify Satellite API is responding
      ansible.builtin.uri:
        url: https://localhost/api/v2/status
        validate_certs: false
        user: admin
        password: "{{ satellite_password }}"
        force_basic_auth: true
        status_code: 200
      changed_when: false

- name: Healthcheck - RHEL hosts reachable from satellite
  hosts: satellite
  gather_facts: false
  become: true
  vars:
    guid: "{{ lookup('ansible.builtin.env', 'GUID') }}"
    rhel1: "rhel-{{ guid }}-1"
    rhel2: "rhel-{{ guid }}-2"
  tasks:
    - name: Verify rhel1 is reachable (ping only — no SSH from satellite)
      ansible.builtin.command: "ping -c 1 -W 5 {{ rhel1 }}"
      changed_when: false

    - name: Verify rhel2 is reachable (ping)
      ansible.builtin.command: "ping -c 1 -W 5 {{ rhel2 }}"
      changed_when: false

    - name: Verify SSH to rhel2 (satellite-managed, key auth)
      ansible.builtin.command:
        cmd: "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@{{ rhel2 }} hostname"
      changed_when: false
      timeout: 30

- name: Healthcheck - HCC/Akamai connectivity (from satellite)
  hosts: satellite
  gather_facts: false
  become: true
  tasks:
    - name: Verify connectivity to Insights upload endpoint (cert-api.access.redhat.com)
      ansible.builtin.command:
        cmd: >-
          curl -sk -o /dev/null -w '%{http_code}' --max-time 15
          https://cert-api.access.redhat.com/r/insights/
      register: _hcc_https
      changed_when: false
      failed_when: _hcc_https.stdout not in ['200', '401', '403', '405', '301', '302']
      timeout: 30

    - name: Log Insights endpoint status
      ansible.builtin.debug:
        msg: "cert-api.access.redhat.com returned HTTP {{ _hcc_https.stdout }} (non-block = healthy)"

    - name: Verify connectivity to Hybrid Cloud Console (console.redhat.com)
      ansible.builtin.command:
        cmd: >-
          curl -sk -o /dev/null -w '%{http_code}' --max-time 15
          https://console.redhat.com/
      register: _console_https
      changed_when: false
      failed_when: _console_https.stdout not in ['200', '301', '302', '403']
      timeout: 30

    - name: Log HCC console status
      ansible.builtin.debug:
        msg: "console.redhat.com returned HTTP {{ _console_https.stdout }} (non-block = healthy)"

- name: Healthcheck - Module 04/05 preconditions (Satellite disconnected environment)
  hosts: satellite
  gather_facts: false
  become: true
  vars:
    satellite_password: "bc31c9a6-9ff0-11ec-9587-00155d1b0702"
    guid: "{{ lookup('ansible.builtin.env', 'GUID') }}"
    rhel2: "rhel-{{ guid }}-2"
    rhel2_satellite: "rhel-{{ guid }}-2.lab"
  tasks:
    - name: Verify rhel2 is registered in Satellite
      ansible.builtin.command:
        cmd: "hammer host info --name {{ rhel2_satellite }}"
      changed_when: false
      timeout: 15

    - name: Check CVE map file exists
      ansible.builtin.stat:
        path: /var/lib/foreman/cvemap.xml
      register: r_cvemap

    - name: "WARNING: CVE map file missing (expected on fresh environments)"
      ansible.builtin.debug:
        msg: >-
          /var/lib/foreman/cvemap.xml not found. On freshly deployed environments,
          wait 15-20 minutes for Lightspeed containers to generate this file.
          Module 05 (vulnerability remediation) will not work without it.
      when: not r_cvemap.stat.exists

    - name: Check Lightspeed advisor API availability
      ansible.builtin.uri:
        url: https://localhost/api/v2/insights_hosts
        validate_certs: false
        user: admin
        password: "{{ satellite_password }}"
        force_basic_auth: true
        status_code: [200, 404]
        return_content: true
      register: _insights_hosts
      changed_when: false

    - name: "WARNING: Insights API not available (foreman_rh_cloud plugin not enabled)"
      ansible.builtin.debug:
        msg: >-
          /api/v2/insights_hosts returned 404. The foreman_rh_cloud plugin is not
          enabled in Satellite. Lightspeed containers are running (podman ps) but
          Foreman cannot communicate with them. Modules 04/05 will not work.
          This requires Satellite admin intervention to enable the plugin.
      when: _insights_hosts.status == 404

    - name: Check Lightspeed host data count
      ansible.builtin.set_fact:
        _insights_total: "{{ (_insights_hosts.json.total | default(0) | int) if _insights_hosts.status == 200 else 0 }}"

    - name: "WARNING: No Lightspeed data yet (run insights-client on rhel2 first)"
      ansible.builtin.debug:
        msg: >-
          No hosts with Lightspeed data found in Satellite (total={{ _insights_total }}).
          On freshly deployed environments, run insights-client on rhel2 first,
          then wait 10-15 minutes for Lightspeed containers to process the data.
          Modules 04/05 will not work without this.
      when: (_insights_total | int) < 1

    - name: Verify Lightspeed containers are running
      ansible.builtin.command:
        cmd: podman ps --format '{{ '{{' }}.Names{{ '}}' }}' --filter name=iop-
      register: _lightspeed_containers
      changed_when: false
      timeout: 15

    - name: Log Lightspeed container count
      ansible.builtin.debug:
        msg: "Lightspeed containers running: {{ _lightspeed_containers.stdout_lines | length }}"

    - name: Verify vulnerable openssl baseline on rhel2
      ansible.builtin.command:
        cmd: "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@{{ rhel2 }} rpm -q openssl"
      register: _rhel2_openssl
      changed_when: false
      timeout: 30

    - name: Log openssl version on rhel2
      ansible.builtin.debug:
        msg: "rhel2 openssl: {{ _rhel2_openssl.stdout }}"

    - name: Verify errata RHSA-2026:1472 is available in Satellite
      ansible.builtin.command:
        cmd: hammer erratum info --id RHSA-2026:1472
      changed_when: false
      timeout: 15

- name: Healthcheck - Wetty terminals accessible
  hosts: satellite
  gather_facts: false
  become: true
  vars:
    guid: "{{ lookup('ansible.builtin.env', 'GUID') }}"
    domain: "{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
    showroom_host: "{{ guid }}.{{ domain }}"
  tasks:
    - name: Verify satellite terminal (wetty)
      ansible.builtin.command:
        cmd: >-
          curl -sk -o /dev/null -w '%{http_code}' --max-time 10
          https://{{ showroom_host }}/wetty_satellite/ssh/root
      register: _wetty_sat
      changed_when: false
      failed_when: _wetty_sat.stdout not in ['200', '301', '302', '401', '403']

    - name: "Verify rhel1 terminal (wetty)"
      ansible.builtin.command:
        cmd: >-
          curl -sk -o /dev/null -w '%{http_code}' --max-time 10
          https://{{ showroom_host }}/wetty_rhel-{{ guid }}-1
      register: _wetty_rhel1
      changed_when: false
      failed_when: _wetty_rhel1.stdout not in ['200', '301', '302', '401', '403']

    - name: "Verify rhel2 terminal (wetty)"
      ansible.builtin.command:
        cmd: >-
          curl -sk -o /dev/null -w '%{http_code}' --max-time 10
          https://{{ showroom_host }}/wetty_rhel-{{ guid }}-2/ssh/root
      register: _wetty_rhel2
      changed_when: false
      failed_when: _wetty_rhel2.stdout not in ['200', '301', '302', '401', '403']
