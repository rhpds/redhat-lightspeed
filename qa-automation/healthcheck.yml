---
# HEALTHCHECK — Quick environment readiness check (migrated ZT Guided content)
# Verifies the bastion host is reachable via SSH and the Satellite web UI is
# accessible via HTTPS. Non-destructive: does not modify any lab state.
# Should complete in under 60 seconds.
#
# Exit 0 = healthy, non-zero = unhealthy.

- name: Build inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add bastion host
      ansible.builtin.add_host:
        name: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
        ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"

- name: Verify SSH connectivity to bastion
  hosts: all:!localhost
  gather_facts: false
  become: false
  tasks:
    - name: Ping bastion host
      ansible.builtin.ping:

- name: Verify Satellite web UI is available
  hosts: localhost
  gather_facts: false
  vars:
    satellite_url: "https://satellite-{{ lookup('ansible.builtin.env', 'GUID') }}.{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
  tasks:
    - name: Check Satellite HTTPS endpoint responds
      ansible.builtin.uri:
        url: "{{ satellite_url }}"
        method: GET
        validate_certs: false
        status_code:
          - 200
          - 302
          - 401
        timeout: 30
      register: satellite_check
      retries: 5
      delay: 10
      until: satellite_check is not failed
