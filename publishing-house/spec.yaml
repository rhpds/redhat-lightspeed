# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: "This lab is the only beginner-level item in the RHDP catalog that combines Red Hat Lightspeed across both the Hybrid Cloud Console (for internet-connected hosts) and Red Hat Satellite (for disconnected hosts) in a single scenario. Existing catalog items cover these topics separately and only at intermediate difficulty."
    design_overview: >
      This lab demonstrates Red Hat Lightspeed's dual deployment model — at the Hybrid Cloud Console
      for internet-connected RHEL hosts and on-premise via Red Hat Lightspeed in Satellite for
      disconnected environments. Participants work through a realistic scenario for the fictional
      company Infinicorp, completing four hands-on tasks: identifying and remediating CVEs, evaluating
      SCAP compliance (both via the Hybrid Cloud Console), managing advisor recommendations, and
      exploring vulnerability detection (both via Red Hat Lightspeed in Satellite 6.19). All
      capabilities demonstrated are generally available in their respective products.
    module_summaries:
      - id: module-01
        summary: >
          Introduces the Infinicorp scenario and the distinction between Red Hat Lightspeed at the
          Hybrid Cloud Console and on-premise Red Hat Lightspeed in Satellite; establishes the context
          for the four hands-on tasks.
      - id: module-02
        summary: >
          Guides learners through identifying CVEs on a RHEL 9.7 host using the Red Hat Lightspeed
          vulnerability service at the Hybrid Cloud Console, generating Ansible remediation playbooks,
          and producing executive and custom PDF vulnerability reports.
      - id: module-03
        summary: >
          Walks learners through creating a CIS Level 1 SCAP compliance policy, running a compliance
          scan with insights-client, and reviewing results and remediation steps using Red Hat
          Lightspeed at the Hybrid Cloud Console.
      - id: module-04
        summary: >
          Demonstrates how to view and remediate an advisor recommendation on a disconnected RHEL 10.1
          host using Red Hat Lightspeed in Satellite 6.19, including triggering a Red Hat-generated
          playbook directly from the Satellite Web UI.
      - id: module-05
        summary: >
          Explores the generally available vulnerability service inside Red Hat Satellite 6.19 by
          examining CVEs detected on the Satellite-connected RHEL 10.1 host and following a link to
          the Red Hat CVE database for additional context.
      - id: module-06
        summary: >
          Summarizes the four completed tasks and presents a product team overview of the GA status
          and containerized Podman architecture of Red Hat Lightspeed in Satellite, including the
          update delivery model.
    rcars_overlap_pct: 77
    rcars_top_matches:
      - title: "Red Hat Satellite Compliance"
        ci_name: "zt-rhelbu.zt-satellite-compliance.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-satellite-compliance.prod"
        relevance_score: 77
        why_it_fits: "Covers OpenSCAP compliance scanning and remediation within Red Hat Satellite against RHEL hosts, aligning with the compliance module in this lab."
      - title: "Red Hat Satellite Proactive Remediation"
        ci_name: "zt-rhelbu.zt-satellite-lightspeed-ansible.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-satellite-lightspeed-ansible.prod"
        relevance_score: 70
        why_it_fits: "Covers Red Hat Satellite's vulnerability dashboard and CVE detection across RHEL hosts, touching several of the same topic areas."
      - title: "Remediating vulnerabilities with Red Hat Insights Vulnerability"
        ci_name: "zt-rhelbu.zt-insights-vulnerability.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-insights-vulnerability.prod"
        relevance_score: 58
        why_it_fits: "Beginner-level Hybrid Cloud Console CVE analysis and vulnerability management on RHEL systems, covering a core portion of the requested learning objectives."
    rejections: []

